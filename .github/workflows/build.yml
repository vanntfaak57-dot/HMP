# Đóng gói và phát hành phần mềm Quản lý kho
# Mỗi lần đẩy mã lên nhánh main:
#   - Dựng KhoETC.exe trên máy Windows, chạy toàn bộ kiểm thử bằng chính file .exe
#   - Dựng bản Linux và gói cập nhật
#   - Tạo / cập nhật bản phát hành v<phiên bản trong package.json> kèm các file tải về
name: Đóng gói phần mềm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (KhoETC.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Dựng KhoETC.exe
        run: node tools/build-app.js win
      - name: Kiểm thử KhoETC.exe trên Windows
        shell: pwsh
        run: |
          Expand-Archive build/dist/KhoETC-Windows-x64.zip -DestinationPath "$env:RUNNER_TEMP\app"
          $env:APP_BIN = "$env:RUNNER_TEMP\app\KhoETC-Windows-x64\KhoETC.exe"
          $env:TEST_TMP = $env:RUNNER_TEMP
          node test/test.js
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node test/test-update.js
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node test/test-lan.js
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node test/test-online.js
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node test/test-security.js
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # KhoETC.exe phải là ứng dụng Windows chạy ngầm (PE subsystem = 2), không mở cửa sổ đen
          $b = [IO.File]::ReadAllBytes($env:APP_BIN); $pe = [BitConverter]::ToInt32($b, 0x3c)
          $sub = [BitConverter]::ToUInt16($b, $pe + 24 + 68); Write-Output "PE subsystem: $sub"
          if ($sub -ne 2) { exit 1 }
      - name: Dừng tiến trình còn chạy
        if: always()
        shell: bash
        run: taskkill //F //IM KhoETC.exe || true
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/dist/KhoETC-Windows-x64.zip

  linux:
    name: Linux + gói cập nhật
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Kiểm thử mã nguồn
        run: |
          npm test
          node test/test-security.js
      - name: Dựng bản Linux và gói cập nhật
        run: node tools/build-app.js update linux
      - name: Kiểm thử bản Linux đã đóng gói
        run: |
          APP_BIN=build/dist/KhoETC-Linux-x64/KhoETC node test/test.js
          APP_BIN=build/dist/KhoETC-Linux-x64/KhoETC node test/test-online.js
          APP_BIN=build/dist/KhoETC-Linux-x64/KhoETC node test/test-security.js
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/dist/KhoETC-Linux-x64.zip
            build/dist/KhoETC-update-*.khoupd
            build/dist/latest.json

  release:
    name: Phát hành
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Đọc phiên bản và ghi chú
        id: ver
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "
            const m = require('./dist/latest.json');
            const body = 'Phần mềm Quản lý kho - phiên bản ' + m.version + '\n\n' + m.notes +
              '\n\n**Tải về**\n- **KhoETC-Windows-x64.zip**: app cho Windows (giải nén, bấm đúp KhoETC.exe)\n- KhoETC-Linux-x64.zip: app cho Linux\n- KhoETC-update-' + m.version + '.khoupd: gói cập nhật (Hệ thống → Cập nhật phần mềm)\n- latest.json: thông tin phiên bản cho chức năng kiểm tra cập nhật\n\nBản online (Docker/VPS/Render): xem HUONG-DAN-TRIEN-KHAI.md.';
            require('fs').writeFileSync('release-notes.md', body);"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          make_latest: true
          files: |
            dist/KhoETC-Windows-x64.zip
            dist/KhoETC-Linux-x64.zip
            dist/KhoETC-update-*.khoupd
            dist/latest.json
